[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives-toolkit"
version = "0.3.0"
description = "金融衍生品定价与研究工具包"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
    "numba>=0.57",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
wind = []

[tool.setuptools.packages.find]
include = ["derivatives*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
